# Include this server block from the http context of your Nginx configuration.
# HTTP access: http://YOUR_PUBLIC_IP:80/ (no domain or certificate required).
# Replace 203.0.113.10 with the actual ECS public IPv4 address.
# To use another port, update listen and both cloud/host firewall rules.
# The deployment guide switches current to a verified release directory.
server {
    listen 8080;
    server_name 101.37.235.61;

    root /root/project/ai-lol/dist;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json;

    # Filenames are not content-hashed; revalidate after updates.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
